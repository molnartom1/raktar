<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Egyszerű készletkezelő (HTML + Firebase) – többsoros mozgás</title>
  <style>
    :root { --bg:#f8fafc; --card:#fff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --accent:#0f172a; }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,sans-serif;background:var(--bg);color:var(--ink)}
    .wrap{max-width:1100px;margin:auto;padding:24px}
    header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}
    h1{font-size:clamp(20px,2.6vw,28px);margin:0}
    .tag{font-size:12px;color:var(--muted)}
    .tabs{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 24px}
    .tabbtn{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:#f1f5f9;cursor:pointer}
    .tabbtn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 1px 0 rgba(2,6,23,.04)}
    .grid{display:grid;gap:16px}
    .grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
    @media (max-width:900px){.grid-2,.grid-3{grid-template-columns:1fr}}
    label{font-size:13px;color:var(--muted);display:block;margin:4px 0}
    input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fff}
    textarea{min-height:72px}
    .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .btn{padding:10px 14px;border-radius:12px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
    .btn.secondary{background:#fff;color:var(--accent)}
    .btn.ghost{background:#fff;border-color:var(--line);color:var(--ink)}
    table{width:100%;border-collapse:separate;border-spacing:0;min-width:640px}
    thead th{position:sticky;top:0;background:#f1f5f9;text-align:left;font-weight:600;font-size:13px;padding:10px;border-bottom:1px solid var(--line)}
    td{padding:10px;border-bottom:1px solid var(--line);font-size:14px}
    tbody tr.low{background:#fff1f2}
    .tools button{font-size:12px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:#f8fafc;cursor:pointer}
    .muted{color:var(--muted)}
    .error{background:#fee2e2;border:1px solid #fecaca;color:#7f1d1d;padding:10px;border-radius:12px}
    .hide{display:none}
    .inline-actions{display:flex;gap:6px}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Egyszerű készletkezelő</h1>
      <div class="tag">Firebase szinkron • „mosás-nyilvántartás”</div>
    </header>

    <div class="tabs">
      <button class="tabbtn active" data-tab="bevet">Bevét</button>
      <button class="tabbtn" data-tab="kiadas">Kiadás</button>
      <button class="tabbtn" data-tab="keszlet">Raktárkészlet</button>
      <button class="tabbtn" data-tab="torzs">Törzsadatok</button>
    </div>

    <div id="err" class="error hide"></div>

    <!-- Bevét -->
    <section id="tab-bevet" class="grid">
      <!-- Meglévő bevét űrlap és listák változatlanok -->
      <!-- ... -->
    </section>

    <!-- Kiadás -->
    <section id="tab-kiadas" class="grid hide">
      <!-- Meglévő kiadás űrlap és listák változatlanok -->
      <!-- ... -->
    </section>

    <!-- Készlet -->
    <section id="tab-keszlet" class="grid hide">
      <div class="card">
        <h2>Raktárkészlet</h2>
        <div class="tablewrap" style="overflow:auto">
          <table>
            <thead>
              <tr><th>Termék</th><th>Cikkszám</th><th>Készlet</th><th>ME</th><th>Min. készlet</th></tr>
            </thead>
            <tbody id="tbody-stock"></tbody>
          </table>
        </div>
      </div>

      <!-- Szűrők az Összes mozgáshoz -->
      <div class="row" style="gap:12px; flex-wrap:wrap; align-items:center; margin-bottom: 12px;">
        <label for="all-filter-type">Típus:</label>
        <select id="all-filter-type" style="max-width:120px;">
          <option value="">Mind</option>
          <option value="in">Bevétel</option>
          <option value="out">Kiadás</option>
        </select>

        <label for="all-filter-from">Dátum:</label>
        <input id="all-filter-from" type="date" style="max-width:140px;">
        <span>–</span>
        <input id="all-filter-to" type="date" style="max-width:140px;">

        <label for="all-filter-product">Termék:</label>
        <input id="all-filter-product" type="text" placeholder="Termék név" style="max-width:160px;">

        <label for="all-filter-partner">Partner:</label>
        <input id="all-filter-partner" type="text" placeholder="Beszállító / Megrendelő" style="max-width:160px;">

        <button class="btn ghost" id="all-filter-reset" type="button">Törlés</button>
      </div>

      <div class="card">
        <h3>Összes mozgás</h3>
        <div class="tablewrap" style="overflow:auto">
          <table>
            <thead>
              <tr><th>Dátum</th><th>Típus</th><th>Termék</th><th>Mennyiség</th><th>Partner</th><th>Megjegyzés</th></tr>
            </thead>
            <tbody id="tbody-all"></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- Törzsadatok -->
    <section id="tab-torzs" class="grid grid-3 hide">
      <!-- Meglévő törzsadat mezők változatlanok -->
    </section>

    <footer class="muted" style="text-align:center;margin-top:24px">
      Készült: <span id="stamp"></span> • Negatív készlet tiltva • Real-time Firestore
    </footer>
  </div>

  <!-- UI bootstrap külön (tabs, dátum) -->
  <script>
    (function(){
      const $ = (sel) => document.querySelector(sel);
      const $$ = (sel) => Array.from(document.querySelectorAll(sel));
      window.showErr = function(msg){ const e=$('#err'); if(!e) return; e.textContent=String(msg||'Ismeretlen hiba'); e.classList.remove('hide'); };
      window.hideErr = function(){ const e=$('#err'); if(!e) return; e.classList.add('hide'); };
      const stampEl = document.getElementById('stamp');
      if(stampEl){ const d=new Date(); stampEl.textContent = d.toISOString().slice(0,19).replace('T',' '); }
      $$('.tabbtn').forEach(btn=>{
        btn.addEventListener('click',()=>{
          $$('.tabbtn').forEach(b=>b.classList.remove('active'));
          btn.classList.add('active');
          const id = btn.getAttribute('data-tab');
          ['bevet','kiadas','keszlet','torzs'].forEach(t=>{
            const sec = document.getElementById('tab-'+t);
            if(sec) sec.classList.toggle('hide', t!==id);
          });
        });
      });
    })();
  </script>

  <!-- Firebase v9+ modular CDN -->
  <script type="module">
    import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, doc, deleteDoc, query, orderBy, enableIndexedDbPersistence, writeBatch } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
    import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

    const firebaseConfig = {
      apiKey: "AIzaSyAeoxtOe5Cleasm3KdeSHP9WDR3PkU-N1I",
      authDomain: "mosas-nyilvantartas.firebaseapp.com",
      projectId: "mosas-nyilvantartas",
      storageBucket: "mosas-nyilvantartas.appspot.com",
      messagingSenderId: "38259241645",
      appId: "1:38259241645:web:26070b1d0686def9f00c24",
    };

    if (!getApps().length) initializeApp(firebaseConfig);
    const db = getFirestore();
    enableIndexedDbPersistence(db).catch(()=>{});

    const auth = getAuth();
    onAuthStateChanged(auth, (user)=>{ if(!user) signInAnonymously(auth).catch(e=>showErr('Anonim bejelentkezés: '+(e?.message||e))); });

    const COL_SUPPLIERS = 'mosas_suppliers';
    const COL_CUSTOMERS = 'mosas_customers';
    const COL_PRODUCTS = 'mosas_products';
    const COL_MOVEMENTS = 'mosas_movements';

    let suppliers = [], customers = [], products = [], movements = [];

    const $ = (sel) => document.querySelector(sel);
    const fmt = new Intl.NumberFormat('hu-HU', { maximumFractionDigits: 2 });
    const nowISO = () => new Date().toISOString().slice(0,19).replace('T',' ');

    // Élő feliratkozások
    onSnapshot(query(collection(db, COL_SUPPLIERS), orderBy('name')), (snap)=>{ suppliers = snap.docs.map(d=>({id:d.id, ...d.data()})); renderSuppliers(); fillPartners(); });
    onSnapshot(query(collection(db, COL_CUSTOMERS), orderBy('name')), (snap)=>{ customers = snap.docs.map(d=>({id:d.id, ...d.data()})); renderCustomers(); fillPartners(); });
    onSnapshot(query(collection(db, COL_PRODUCTS), orderBy('name')), (snap)=>{ products = snap.docs.map(d=>({id:d.id, ...d.data()})); renderProducts(); fillProducts(); renderStock(); });

    // Mozgások snapshot, itt frissítjük a megjelenítéseket is
    onSnapshot(query(collection(db, COL_MOVEMENTS), orderBy('ts','desc')), (snap)=>{
      movements = snap.docs.map(d=>({id:d.id, ...d.data()}));
      renderMovements();
      renderFilteredMovements();
      renderFilteredAllMovements();
      renderStock();
    });

    // Többsoros űrlapok (bevét/kiadás) - az eseménykezelők és funkciók változatlanul maradnak
    // ...

    // --- Szűrés az Összes mozgás táblázathoz ---
    function dateFilter(stamp, from, to) {
      if(from && stamp < from) return false;
      if(to && stamp > to) return false;
      return true;
    }

    function renderFilteredAllMovements() {
      const filterType = document.getElementById('all-filter-type').value;
      const filterFrom = document.getElementById('all-filter-from').value;
      const filterTo = document.getElementById('all-filter-to').value;
      const filterProduct = document.getElementById('all-filter-product').value.trim().toLowerCase();
      const filterPartner = document.getElementById('all-filter-partner').value.trim().toLowerCase();

      const tbodyAll = document.getElementById('tbody-all');
      tbodyAll.innerHTML = '';

      movements.filter(m => {
        if(filterType && m.type !== filterType) return false;
        const dateStr = m.stamp ? m.stamp.slice(0, 10) : '';
        if(!dateFilter(dateStr, filterFrom, filterTo)) return false;
        const productName = (getProduct(m.productId)?.name || '').toLowerCase();
        if(filterProduct && !productName.includes(filterProduct)) return false;
        const partnerNameIn = (getSupplier(m.partnerId)?.name || '').toLowerCase();
        const partnerNameOut = (getCustomer(m.partnerId)?.name || '').toLowerCase();
        const partnerName = m.type === 'in' ? partnerNameIn : partnerNameOut;
        if(filterPartner && !partnerName.includes(filterPartner)) return false;
        return true;
      }).forEach(m => {
        const p = getProduct(m.productId);
        const partner = m.type === 'in' ? getSupplier(m.partnerId) : getCustomer(m.partnerId);
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${esc(m.stamp || '–')}</td>
          <td>${m.type === 'in' ? 'Bevét' : 'Kiadás'}</td>
          <td>${esc(p ? p.name : m.productId)}</td>
          <td>${fmt.format(m.qty)} ${esc(m.unit || (p?.unit || 'db'))}</td>
          <td>${esc(partner ? partner.name : '–')}</td>
          <td>${esc(m.note || '')}</td>
        `;
        tbodyAll.appendChild(tr);
      });
    }

    ['all-filter-type', 'all-filter-from', 'all-filter-to', 'all-filter-product', 'all-filter-partner'].forEach(id => {
      document.getElementById(id).addEventListener('input', renderFilteredAllMovements);
    });

    document.getElementById('all-filter-reset').addEventListener('click', () => {
      document.getElementById('all-filter-type').value = '';
      document.getElementById('all-filter-from').value = '';
      document.getElementById('all-filter-to').value = '';
      document.getElementById('all-filter-product').value = '';
      document.getElementById('all-filter-partner').value = '';
      renderFilteredAllMovements();
    });

    // A többi meglévő függvény, eseménykezelő, állapotkezelés és render változatlan marad
    // (beleértve renderMovements, renderSuppliers, renderCustomers, renderProducts, renderStock stb.)

    // Segédfüggvények:
    function getProduct(id) { return products.find(p => p.id === id); }
    function getSupplier(id) { return suppliers.find(s => s.id === id); }
    function getCustomer(id) { return customers.find(c => c.id === id); }
    function esc(s) { return String(s || '').replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "'" }[c])); }

  </script>
</body>
</html>
