<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Egyszerű készletkezelő</title>
  <style>
    :root {
      --bg:#f8fafc;
      --card:#fff;
      --ink:#0f172a;
      --muted:#64748b;
      --line:#e2e8f0;
      --accent:#0f172a;
      --ok:#10b981;
      --warn:#ef4444;
      --backdrop:rgba(2,6,23,.5);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,sans-serif;
      background:var(--bg);
      color:var(--ink)
    }
    .wrap{max-width:1100px;margin:auto;padding:24px}
    header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}
    h1{font-size:clamp(20px,2.6vw,28px);margin:0}
    .tag{font-size:12px;color:var(--muted)}
    .tabs{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 24px}
    .tabbtn{
      padding:8px 12px;
      border-radius:999px;
      border:1px solid var(--line);
      background:#f1f5f9;
      cursor:pointer
    }
    .tabbtn.active{
      background:var(--accent);
      color:#fff;
      border-color:var(--accent)
    }
    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:16px;
      padding:16px;
      box-shadow:0 1px 0 rgba(2,6,23,.04)
    }
    .grid{display:grid;gap:16px}
    .grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
    @media (max-width:900px){
      .grid-2,.grid-3{grid-template-columns:1fr}
    }
    label{font-size:13px;color:var(--muted);display:block;margin:4px 0}
    input,select,textarea{
      width:100%;
      padding:10px;
      border:1px solid var(--line);
      border-radius:12px;
      background:#fff
    }
    textarea{min-height:72px}
    .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .btn{
      padding:10px 14px;
      border-radius:12px;
      border:1px solid var(--accent);
      background:var(--accent);
      color:#fff;
      cursor:pointer
    }
    .btn.secondary{background:#fff;color:var(--accent)}
    .btn.ghost{background:#fff;border-color:var(--line);color:#0f172a}
    .btn.small{padding:6px 8px;font-size:12px;border-radius:10px}
    /* Fókusz-kiemelés OFF */
    .btn:focus,
    .btn:focus-visible,
    .tabbtn:focus,
    .tabbtn:focus-visible{
      outline:none;
      box-shadow:none;
    }

    table{
      width:100%;
      border-collapse:separate;
      border-spacing:0;
      min-width:640px
    }
    thead th{
      position:sticky;
      top:0;
      background:#f1f5f9;
      text-align:left;
      font-weight:600;
      font-size:13px;
      padding:10px;
      border-bottom:1px solid var(--line);
      z-index:1
    }
    td{
      padding:10px;
      border-bottom:1px solid var(--line);
      font-size:14px
    }
    tbody tr.low{background:#fff1f2}
    .tools button{
      font-size:12px;
      padding:6px 10px;
      border-radius:10px;
      border:1px solid var(--line);
      background:#f8fafc;
      cursor:pointer
    }
    .muted{color:var(--muted)}
    .error{
      background:#fee2e2;
      border:1px solid #fecaca;
      color:#7f1d1d;
      padding:10px;
      border-radius:12px
    }
    .hide{display:none}
    .inline-actions{display:flex;gap:6px}

    .tablewrap{
      overflow:auto;
      max-height:520px;
      border:1px solid var(--line);
      border-radius:12px;
    }

    .pager{
      display:flex;
      align-items:center;
      gap:8px;
      justify-content:flex-end;
      margin-top:8px
    }
    .pager .btn{padding:8px 10px;border-radius:10px}
    .pager .info{font-size:12px;color:var(--muted)}

    .type-badge{
      display:inline-flex;
      align-items:center;
      gap:6px;
      font-weight:600;
      padding:4px 8px;
      border-radius:999px;
      font-size:12px;
      border:1px solid var(--line);
      background:#fff
    }
    .type-badge .dot{width:8px;height:8px;border-radius:50%}
    .type-in{border-color:#bbf7d0;background:#ecfdf5;color:#064e3b}
    .type-in .dot{background:var(--ok)}
    .type-out{border-color:#fecaca;background:#fef2f2;color:#7f1d1d}
    .type-out .dot{background:var(--warn)}

    .modal-backdrop{
      position:fixed;
      inset:0;
      background:var(--backdrop);
      display:none;
      align-items:center;
      justify-content:center;
      padding:16px;
      z-index:50
    }
    .modal{
      background:#fff;
      border:1px solid var(--line);
      border-radius:16px;
      max-width:520px;
      width:100%;
      box-shadow:0 10px 30px rgba(2,6,23,.2);
      overflow:hidden
    }
    .modal header{
      padding:16px;
      border-bottom:1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:space-between
    }
    .modal h3{margin:0;font-size:18px}
    .modal .content{padding:16px}
    .modal .summary{font-size:14px;color:var(--muted);margin-top:4px}
    .modal .list{margin:8px 0 0 0;padding-left:18px}
    .modal .guard{margin-top:12px}
    .modal .guard label{font-size:12px;color:#6b7280;display:block;margin-bottom:6px}
    .modal .guard input{
      width:100%;
      padding:10px;
      border:1px solid var(--line);
      border-radius:12px
    }
    .modal footer{
      padding:12px 16px;
      border-top:1px solid var(--line);
      display:flex;
      gap:8px;
      justify-content:flex-end
    }
    .btn.bad{border-color:var(--warn);background:var(--warn)}
    .btn.good{border-color:var(--ok);background:var(--ok)}
    .btn.ghost-danger{
      background:#fff;
      border-color:var(--warn);
      color:var(--warn);
    }
    .modal header #modal-close{display:none!important}

    .snackbar{
      position:fixed;
      left:50%;
      transform:translateX(-50%);
      bottom:20px;
      background:#111827;
      color:#fff;
      padding:12px 14px;
      border-radius:12px;
      display:none;
      align-items:center;
      gap:12px;
      z-index:60;
      box-shadow:0 6px 20px rgba(0,0,0,.25)
    }
    .snackbar .undo{
      background:#fff;
      border:0;
      border-radius:10px;
      padding:8px 10px;
      cursor:pointer
    }
    .snackbar .timer{
      width:120px;
      height:4px;
      background:#374151;
      border-radius:999px;
      overflow:hidden
    }
    .snackbar .timer > div{
      height:100%;
      width:100%;
      background:#e5e7eb;
      transform-origin:left;
      animation:snack 10s linear forwards
    }
    @keyframes snack{to{transform:scaleX(0)}}

    .danger{
      border:1px solid #fecaca;
      background:#fff1f2
    }
    .danger h2{color:#991b1b}

    .th-sortable{cursor:pointer;user-select:none}
    .th-sortable .arrow{font-size:11px;margin-left:6px;color:var(--muted)}

    /* Scanner video */
    #scan-video{
      width:100%;
      max-height:320px;
      border-radius:12px;
      background:#000;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Egyszerű készletkezelő</h1>
      <div class="row"><div class="tag">Firebase szinkron</div></div>
    </header>

    <div class="tabs">
      <button class="tabbtn active" data-tab="bevet">Bevét</button>
      <button class="tabbtn" data-tab="kiadas">Kiadás</button>
      <button class="tabbtn" data-tab="keszlet">Raktárkészlet</button>
      <button class="tabbtn" data-tab="torzs">Törzsadatok</button>
    </div>

    <div id="err" class="error hide"></div>

    <!-- Bevét -->
    <section id="tab-bevet" class="grid">
      <div class="card">
        <h2>Új bevét rögzítése</h2>
        <div class="grid grid-3">
          <div>
            <label>Beszállító</label>
            <select id="in-supplier" required></select>
          </div>
          <div>
            <label>Dátum</label>
            <input type="date" id="in-date" required>
          </div>
          <div class="grid-2" style="grid-column:1/-1">
            <div style="grid-column:1/-1">
              <label>Megjegyzés (összes sorra)</label>
              <textarea id="in-note"></textarea>
            </div>
          </div>
        </div>

        <div style="margin-top:12px" class="row">
          <button id="in-add-row" class="btn ghost" type="button">+ Sor hozzáadása</button>
          <button id="in-clear-rows" class="btn secondary" type="button">Sorok törlése</button>
          <div class="muted" id="in-sum"></div>
        </div>

        <div class="tablewrap" style="margin-top:10px">
          <table>
            <thead>
              <tr>
                <th style="min-width:260px">Termék</th>
                <th style="min-width:120px">Mennyiség</th>
                <th style="min-width:100px">ME</th>
                <th style="min-width:260px">Megjegyzés (soronként, opcionális)</th>
                <th>Művelet</th>
              </tr>
            </thead>
            <tbody id="tbody-in-rows"></tbody>
          </table>
        </div>

        <div class="row" style="margin-top:12px">
          <button class="btn" id="in-submit" type="button">Bevét rögzítése</button>
        </div>
      </div>

      <!-- Bevét szűrő + lista -->
      <div class="row" style="margin-bottom:10px; margin-top:20px;">
        <label for="in-filter-from">Dátum szűrés:</label>
        <input id="in-filter-from" type="date" style="max-width:140px;margin-left:3px;">
        <span style="margin:0 5px;">–</span>
        <input id="in-filter-to" type="date" style="max-width:140px;">
        <button class="btn ghost" id="in-filter-reset" type="button" style="margin-left:8px;">Törlés</button>
      </div>

      <div class="card">
        <h3>Legutóbbi bevétek</h3>
        <div class="tablewrap">
          <table>
            <thead>
              <tr>
                <th>Dátum</th>
                <th>Típus</th>
                <th>Termék</th>
                <th>Mennyiség</th>
                <th>Partner</th>
                <th>Megjegyzés</th>
      ...
